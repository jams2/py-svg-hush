name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
            interpreters: "-i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 -i 3.14t -i 3.15 -i 3.15t -i pypy3.11"
          - runner: ubuntu-22.04
            target: armv7
            interpreters: "-i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 -i 3.14t -i 3.15 -i 3.15t -i pypy3.11"
          - runner: ubuntu-22.04
            target: s390x
            interpreters: "-i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 -i 3.14t -i 3.15 -i 3.15t -i pypy3.11"
          - runner: ubuntu-22.04
            target: ppc64le
            interpreters: "-i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 -i 3.14t -i 3.15 -i 3.15t -i pypy3.11"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # maturin only discovers interpreters up to 3.14 when cross-compiling, so
          # the cross-compiled architectures name theirs; x86 and x86_64 build in
          # PyPA's own images and discover them.
          args: --release --out dist ${{ matrix.platform.interpreters || '--find-interpreter' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install py_svg_hush --find-links dist --force-reinstall
          pip install pytest
          pytest
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip pytest
          run: |
            set -e
            pip3 install py_svg_hush --find-links dist --force-reinstall
            pytest

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # maturin only discovers interpreters up to 3.14 when cross-compiling, so
          # name them.
          args: --release --out dist -i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 -i 3.14t -i 3.15 -i 3.15t -i pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/io -w /io \
            alpine:latest \
            sh -c 'set -e; apk add py3-pip py3-virtualenv; python3 -m virtualenv .venv; source .venv/bin/activate; pip install py_svg_hush --no-index --find-links dist --force-reinstall; pip install pytest; pytest'
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pytest
            pip install py_svg_hush --find-links dist --force-reinstall
            pytest

  windows:
    name: windows (${{ matrix.platform.runner }}, ${{ matrix.platform.target }}, ${{ matrix.platform.python_arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            pypy: true
            python_versions: "3.10\n3.11\n3.12\n3.13\n3.14\n3.15"
          - runner: windows-latest
            target: x86
            python_arch: x86
            python_versions: "3.10\n3.11\n3.12\n3.13\n3.14\n3.15"
          # Windows on Arm has no Python builds before 3.11. PyPy only ships for x64.
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            python_versions: "3.11\n3.12\n3.13\n3.14\n3.15"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python_versions }}
          # Allow prereleases, so a release candidate is used while no final
          # build is published.
          allow-prereleases: true
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: pytest
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/Scripts/activate
          pip install py_svg_hush --find-links dist --force-reinstall
          pip install pytest
          pytest
      # The free-threaded and PyPy interpreters get their own steps: installing
      # python 3.14t or pypy3.11 next to 3.14 or 3.11 makes the plain name
      # resolve to the new build and hides the regular interpreter.
      - name: Set up free-threaded Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14t
            3.15t
          allow-prereleases: true
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t -i python3.15t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Set up PyPy
        if: ${{ matrix.platform.pypy }}
        uses: actions/setup-python@v6
        with:
          python-version: pypy3.11
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build PyPy wheels
        if: ${{ matrix.platform.pypy }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
          # Allow prereleases, so a release candidate is used while no final
          # build is published.
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: pytest
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install py_svg_hush --find-links dist --force-reinstall
          pip install pytest
          pytest
      # The free-threaded and PyPy interpreters get their own steps: installing
      # python 3.14t or pypy3.11 next to 3.14 or 3.11 makes the plain name
      # resolve to the new build and hides the regular interpreter.
      - name: Set up free-threaded Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14t
            3.15t
          allow-prereleases: true
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t -i python3.15t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Set up PyPy
        uses: actions/setup-python@v6
        with:
          python-version: pypy3.11
      - name: Build PyPy wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
